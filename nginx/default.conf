# Serve Flutter web app and proxy API requests (CORS workaround).
# Requests to /api-proxy/* are forwarded to the real API; browser sees same-origin, no CORS.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to real backend (bypasses CORS: browser -> same origin -> nginx -> API)
    location /api-proxy/ {
        proxy_pass https://m.bel.com.bz/MobileApisTest/;
        proxy_http_version 1.1;
        proxy_set_header Host m.bel.com.bz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_pass_request_headers on;
        proxy_buffering on;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Flutter web app (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
